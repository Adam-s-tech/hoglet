# Hoglet behind nginx. Put in /etc/nginx/conf.d/hoglet.conf (or sites-available).
# Certificates: certbot --nginx -d analytics.example.com, or any ACME client.
#
# Hoglet listens on 127.0.0.1:8000 (deploy/systemd/hoglet.service).

upstream hoglet {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name analytics.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name analytics.example.com;

    ssl_certificate     /etc/letsencrypt/live/analytics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Server SDKs batch to /batch/; keep headroom above SDK defaults.
    client_max_body_size 20m;

    location / {
        proxy_pass http://hoglet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Client IP: OVERWRITE X-Forwarded-For with the peer address rather
        # than appending ($proxy_add_x_forwarded_for), so a client cannot
        # inject a forged address. Hoglet sees exactly one trustworthy IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Capture must not be buffered behind slow clients' retries.
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
}
